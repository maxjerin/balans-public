# Static SPA: serve hashed assets, fall back to index.html for any path.
# EvenSides keeps all state in the URL fragment (#…), so the server only ever
# returns index.html — the fragment never reaches it (the privacy boundary).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # long-cache the fingerprinted assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
